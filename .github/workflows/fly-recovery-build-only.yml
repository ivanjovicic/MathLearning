name: Fly recovery image build only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APPROVED_SOURCE_SHA: d945f51446e4d6e853bbc136134915b4c183aaf4
      IMAGE_NAME: mathlearning-api:recovery-verify
    steps:
      - name: Check out approved application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: d945f51446e4d6e853bbc136134915b4c183aaf4
          path: application
          persist-credentials: false

      - name: Verify source and record workflow identity
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          actual=$(git -C application rev-parse HEAD)
          test "$actual" = "$APPROVED_SOURCE_SHA"
          test -z "$(git -C application status --porcelain)"
          {
            echo "Application source SHA: $actual"
            echo "Workflow SHA: $WORKFLOW_SHA"
            echo "Workflow run: $RUN_ID; attempt: $RUN_ATTEMPT"
          } | tee "$RUNNER_TEMP/recovery-evidence.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up .NET for assembly inspection
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Build and load image without deploying
        shell: bash
        run: |
          set -euo pipefail
          sdk_tag=mcr.microsoft.com/dotnet/sdk:8.0-jammy
          runtime_tag=mcr.microsoft.com/dotnet/aspnet:8.0-jammy-chiseled
          docker pull --platform linux/amd64 "$sdk_tag"
          docker pull --platform linux/amd64 "$runtime_tag"
          sdk_image=$(docker image inspect "$sdk_tag" --format '{{index .RepoDigests 0}}')
          runtime_image=$(docker image inspect "$runtime_tag" --format '{{index .RepoDigests 0}}')
          [[ "$sdk_image" =~ @sha256:[0-9a-f]{64}$ ]]
          [[ "$runtime_image" =~ @sha256:[0-9a-f]{64}$ ]]
          printf 'SDK base: %s\nRuntime base: %s\n' "$sdk_image" "$runtime_image" | tee -a "$RUNNER_TEMP/recovery-evidence.txt" >> "$GITHUB_STEP_SUMMARY"
          docker buildx build --platform linux/amd64 --load --provenance=false \
            --build-arg "SDK_IMAGE=$sdk_image" --build-arg "RUNTIME_IMAGE=$runtime_image" \
            --label "org.opencontainers.image.revision=$APPROVED_SOURCE_SHA" \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            --tag "$IMAGE_NAME" application
          test "$(docker image inspect "$IMAGE_NAME" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$APPROVED_SOURCE_SHA"
          python3 - "$RUNNER_TEMP/build-metadata.json" "$IMAGE_NAME" <<'PY'
          import json, re, subprocess, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              metadata = json.load(f)
          digest = metadata.get('containerimage.digest', '')
          config = metadata.get('containerimage.config.digest', '')
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
              raise SystemExit('Missing image manifest digest in Buildx metadata')
          image_id = subprocess.check_output(['docker', 'image', 'inspect', sys.argv[2], '--format', '{{.Id}}'], text=True).strip()
          if config != image_id:
              raise SystemExit('Loaded image config does not match build metadata')
          entrypoint = json.loads(subprocess.check_output(['docker', 'image', 'inspect', sys.argv[2], '--format', '{{json .Config.Entrypoint}}'], text=True))
          if entrypoint != ['dotnet', 'MathLearning.Api.dll']:
              raise SystemExit('Unexpected API image entrypoint')
          print('Buildx local manifest digest (not registry-verified):', digest)
          print('Local image config digest (image ID):', config)
          PY

      - name: Extract and verify published API binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/image-app" "$RUNNER_TEMP/probe"
          container_id=$(docker create "$IMAGE_NAME")
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          docker cp "$container_id:/app/." "$RUNNER_TEMP/image-app/"
          test -s "$RUNNER_TEMP/image-app/MathLearning.Api.dll"
          test -s "$RUNNER_TEMP/image-app/MathLearning.Api.deps.json"
          test -s "$RUNNER_TEMP/image-app/MathLearning.Infrastructure.dll"
          python3 - "$RUNNER_TEMP/image-app/MathLearning.Api.deps.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              deps = json.load(f)
          if not any(name.startswith('MathLearning.Infrastructure/') for name in deps['libraries']):
              raise SystemExit('Published API does not reference the infrastructure assembly')
          PY
          sha256sum "$RUNNER_TEMP/image-app/MathLearning.Api.dll" "$RUNNER_TEMP/image-app/MathLearning.Infrastructure.dll" | tee -a "$RUNNER_TEMP/recovery-evidence.txt" >> "$GITHUB_STEP_SUMMARY"
          cat > "$RUNNER_TEMP/probe/Probe.csproj" <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net8.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable></PropertyGroup>
            <ItemGroup><FrameworkReference Include="Microsoft.AspNetCore.App" /></ItemGroup>
          </Project>
          XML
          cat > "$RUNNER_TEMP/probe/Program.cs" <<'CS'
          using System.Reflection;
          using System.Runtime.Loader;
          using System.Security.Cryptography;
          using System.Text;

          var path = Path.GetFullPath(args[0]);
          AssemblyLoadContext.Default.Resolving += (context, name) => {
              var file = Path.Combine(path, name.Name + ".dll");
              return File.Exists(file) ? context.LoadFromAssemblyPath(file) : null;
          };
          var assembly = AssemblyLoadContext.Default.LoadFromAssemblyPath(Path.Combine(path, "MathLearning.Infrastructure.dll"));
          var migrations = new List<string>();
          foreach (var type in assembly.GetTypes()) {
              var attrs = type.GetCustomAttributesData();
              var context = attrs.SingleOrDefault(a => a.AttributeType.FullName == "Microsoft.EntityFrameworkCore.Infrastructure.DbContextAttribute");
              var migration = attrs.SingleOrDefault(a => a.AttributeType.FullName == "Microsoft.EntityFrameworkCore.Migrations.MigrationAttribute");
              if (context?.ConstructorArguments[0].Value is Type ctx && ctx.FullName == "MathLearning.Infrastructure.Persistance.ApiDbContext" && migration?.ConstructorArguments[0].Value is string id) {
                  if (type.IsAbstract || !IsMigration(type)) throw new Exception("Invalid migration type: " + type.FullName);
                  migrations.Add(id);
              }
          }
          migrations.Sort(StringComparer.Ordinal);
          foreach (var id in migrations) Console.WriteLine(id);
          var migrationSetHash = Convert.ToHexString(SHA256.HashData(Encoding.UTF8.GetBytes(string.Join("\n", migrations) + "\n"))).ToLowerInvariant();
          if (migrations.Count != 62 || migrations.Distinct().Count() != 62 || migrations[^1] != "20261101185317_RepairUserAnswerAuditXpSchema" ||
              migrationSetHash != "3c6e54fd2f83f7b7804f09e8fefc2c78f470bf74efceb88c4a8211b6a8fea5b8")
              throw new Exception("Unexpected ApiDbContext migration set");
          Console.WriteLine("Compiled API migrations verified: 62; set SHA-256: " + migrationSetHash);

          static bool IsMigration(Type type) {
              for (var current = type.BaseType; current != null; current = current.BaseType)
                  if (current.FullName == "Microsoft.EntityFrameworkCore.Migrations.Migration") return true;
              return false;
          }
          CS
          dotnet run --project "$RUNNER_TEMP/probe/Probe.csproj" --configuration Release -- "$RUNNER_TEMP/image-app" | tee -a "$RUNNER_TEMP/recovery-evidence.txt"
          echo "Image binaries and migration assembly verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve image and build evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/build-metadata.json" >> "$RUNNER_TEMP/recovery-evidence.txt" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              metadata = json.load(f)
          print('Buildx local manifest digest (not registry-verified):', metadata['containerimage.digest'])
          print('Local image config digest (image ID):', metadata['containerimage.config.digest'])
          PY
          cat "$RUNNER_TEMP/recovery-evidence.txt" >> "$GITHUB_STEP_SUMMARY"
          docker save "$IMAGE_NAME" --output "$RUNNER_TEMP/recovery-image.tar"
          archive_sha=$(sha256sum "$RUNNER_TEMP/recovery-image.tar" | cut -d ' ' -f 1)
          echo "Exported archive SHA-256: $archive_sha" | tee -a "$RUNNER_TEMP/recovery-evidence.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fly-recovery-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/recovery-image.tar
            ${{ runner.temp }}/recovery-evidence.txt
            ${{ runner.temp }}/build-metadata.json
          if-no-files-found: error
          retention-days: 7
