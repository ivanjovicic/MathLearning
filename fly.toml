app = "mathlearning-api"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  ASPNETCORE_URLS = "http://+:8080"
  # URLS is the canonical Fly binding; clear framework defaults to avoid an override warning.
  HTTP_PORTS = ""
  HTTPS_PORTS = ""
  DataProtection__KeysPath = "/data/dataprotection-keys"
  Redis__Required = "false"
  # Keep managed heap under control to reduce the chance of the Fly VM being OOM-killed.
  # Prefer Percent unless you are sure about the machine memory size.
  DOTNET_GCHeapHardLimitPercent = "70"
  # Hints the GC to be more aggressive about memory returning.
  DOTNET_GCConserveMemory = "1"

[[mounts]]
  source = "mathlearning_data"
  destination = "/data"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health/"
